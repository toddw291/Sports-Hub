name: Refresh sports snapshot

on:
  schedule:
    # 11:15 UTC, about 6:15am Eastern standard or 7:15am Eastern daylight.
    - cron: "15 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unit checks
        run: node --test scripts/normalize.test.mjs

      - name: Download the latest scores
        run: node scripts/build-snapshot.mjs

      - name: Commit the snapshot if scores changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sports/data/snapshot.json
          if git diff --cached --quiet; then
            echo "No score change."
          else
            git commit -m "Refresh sports snapshot from ESPN"
            git push
          fi
